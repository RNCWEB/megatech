<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Megatech | Produtos</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#080e13;color:#eef2f4;font:15px system-ui,sans-serif}main{width:min(960px,100% - 32px);margin:32px auto}h1,h2{margin:.3em 0 .8em}h1 b{color:#ff923e}a{color:#ffb47c}section{background:#111b22;border:1px solid #293841;border-radius:16px;padding:20px;margin:18px 0}label{display:grid;gap:6px;color:#bec9cf}input,textarea,button{font:inherit}input:not([type=checkbox]),textarea{width:100%;background:#080e13;color:#fff;border:1px solid #394954;border-radius:9px;padding:12px}button{border:1px solid #40535f;border-radius:9px;padding:11px 15px;background:#1b2932;color:#fff;cursor:pointer}button.primary{background:#ff923e;color:#101010;border-color:#ff923e;font-weight:700}button:disabled{opacity:.55;cursor:wait}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.full{grid-column:1/-1}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}.entry{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 0;border-top:1px solid #293841;flex-wrap:wrap}.entry p{margin:5px 0;color:#b9c4c9}#status{min-height:24px;white-space:pre-wrap;color:#ffb47c}header{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap} [hidden]{display:none!important}@media(max-width:540px){.grid{grid-template-columns:1fr}section{padding:15px}main{margin-top:18px}}
</style></head><body><main><header><div><h1>MEGA<b>TECH</b></h1><p>Gerenciamento de produtos</p></div><a href="/">Voltar ao site</a></header><p id="status" role="status" aria-live="polite"></p>
<section id="login"><h2>Acesso administrativo</h2><form id="loginform"><label>Chave de acesso<input type="password" id="key" required autocomplete="current-password"></label><div class="actions"><button class="primary">Entrar</button></div></form></section>
<div id="dashboard" hidden><button id="logout">Sair</button><section><h2 id="formtitle">Cadastrar produto</h2><form id="product"><div class="grid">
<label>Nome<input name="nome" maxlength="150" required></label><label>Categoria<input name="categoria" maxlength="100"></label>
<label class="full">Descrição<textarea name="descricao" maxlength="2000" rows="3"></textarea></label>
<label>Preço (R$)<input name="preco" type="number" min="0" max="9999999.99" step=".01" required></label><label>Preço promocional (opcional)<input name="promo" type="number" min="0" max="9999999.99" step=".01"></label>
<label>Estoque<input name="estoque" type="number" min="0" max="999999" step="1" value="1" required></label><label>Link HTTPS da imagem<input name="imagem_url" type="url" maxlength="2048" placeholder="https://..."></label>
<label><span><input name="ativo" type="checkbox" checked> Mostrar no site</span></label><label><span><input name="destaque" type="checkbox"> Destaque</span></label>
</div><div class="actions"><button class="primary" type="submit">Salvar produto</button><button type="button" id="cancel">Limpar</button></div></form></section><section><h2>Produtos cadastrados</h2><div id="list"></div></section></div></main>
<script>
(()=>{const $=id=>document.getElementById(id),form=$("product"),login=$("loginform"),status=$("status");let token="",editing=null,busy=false;
const say=s=>status.textContent=s;const money=c=>(c/100).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
async function api(path="",method="GET",data){const res=await fetch("/api/admin/produtos"+path,{method,headers:{"Authorization":"Bearer "+token,...(data?{"Content-Type":"application/json"}:{})},...(data?{body:JSON.stringify(data)}:{})});const j=await res.json();if(!res.ok)throw Error(j.erro||"Falha no servidor.");return j;}
function reset(){editing=null;form.reset();$("formtitle").textContent="Cadastrar produto";}
function edit(p){editing=p.id;for(const k of ["nome","categoria","descricao","estoque","imagem_url"])form.elements[k].value=p[k]??"";form.elements.preco.value=(p.preco_centavos/100).toFixed(2);form.elements.promo.value=p.preco_promocional_centavos==null?"":(p.preco_promocional_centavos/100).toFixed(2);for(const k of ["ativo","destaque"])form.elements[k].checked=!!p[k];$("formtitle").textContent="Editar produto";form.scrollIntoView({behavior:"smooth",block:"center"});}
function btn(t,fn){const b=document.createElement("button");b.type="button";b.textContent=t;b.onclick=fn;return b;}
async function refresh(){const {produtos}=await api();const list=$("list");list.replaceChildren();if(!produtos.length){list.textContent="Nenhum produto cadastrado.";return;}for(const p of produtos){const row=document.createElement("div");row.className="entry";const info=document.createElement("div"),title=document.createElement("strong"),detail=document.createElement("p");title.textContent=p.nome;detail.textContent=money(p.preco_promocional_centavos??p.preco_centavos)+" · Estoque: "+p.estoque+" · "+(p.ativo?"Publicado":"Oculto");info.append(title,detail);const actions=document.createElement("div");actions.className="actions";actions.append(btn("Editar",()=>edit(p)),btn("Excluir",async()=>{if(!confirm("Excluir "+p.nome+"?"))return;try{await api("/"+p.id,"DELETE");if(editing===p.id)reset();await refresh();say("Produto excluído.");}catch(e){say(e.message);}}));row.append(info,actions);list.append(row);}}
login.onsubmit=async e=>{e.preventDefault();if(busy)return;busy=true;token=$("key").value;try{await refresh();$("key").value="";$("login").hidden=true;$("dashboard").hidden=false;say("Acesso autorizado.");}catch(e){token="";say(e.message);}finally{busy=false;}};
$("logout").onclick=()=>{token="";reset();$("list").replaceChildren();$("dashboard").hidden=true;$("login").hidden=false;say("Sessão encerrada.");};
$("cancel").onclick=reset;form.onsubmit=async e=>{e.preventDefault();if(busy)return;busy=true;const b=form.querySelector("[type=submit]");b.disabled=true;const f=form.elements;const p={nome:f.nome.value,descricao:f.descricao.value,categoria:f.categoria.value,preco_centavos:Math.round(Number(f.preco.value)*100),preco_promocional_centavos:f.promo.value===""?null:Math.round(Number(f.promo.value)*100),estoque:Number(f.estoque.value),imagem_url:f.imagem_url.value,ativo:Number(f.ativo.checked),destaque:Number(f.destaque.checked)};try{await api(editing?"/"+editing:"",editing?"PUT":"POST",p);reset();await refresh();say("Produto salvo.");}catch(e){say(e.message);}finally{busy=false;b.disabled=false;}};
})();
</script></body></html>
